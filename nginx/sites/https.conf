# =============================================================================
# Servidores HTTPS :443 (Persona 2, Escenario 2: Reverse Proxy)
# =============================================================================
# Un solo puerto publico; el subdominio decide a que backend se enruta:
#
#   https://app.localhost      -> frontend    (Expo web, Nginx interno :80)
#                                 + /api, /api/ws -> gateway:8080
#   https://profile.localhost  -> profile-web (Next.js SSR :3000)
#   https://localhost          -> solo /api y /healthz; el resto redirige a
#                                 app.localhost
#
# Se usan subdominios (y no rutas como /profile) para no tener que cambiar
# el basePath de Next.js ni el codigo de los frontends. Los navegadores y
# curl resuelven *.localhost a 127.0.0.1 sin editar /etc/hosts.
#
# La app Expo se sirve en app.localhost y no en localhost porque, cuando se
# abre en "localhost", su codigo fuerza la URL http://localhost:8080 para el
# API (frontend/mobile/src/config/api.config.ts), que ya no esta publicada.
# Los certificados y protocolos TLS vienen de conf.d/ssl.conf (Persona 1).
# =============================================================================

# -----------------------------------------------------------------------------
# localhost (y cualquier Host desconocido, p. ej. 127.0.0.1)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    server_name localhost;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # El API queda disponible tambien aqui para scripts y curl
    # (https://localhost/api/...).
    include /etc/nginx/snippets/api-locations.conf;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        return 302 https://app.localhost$request_uri;
    }
}

# -----------------------------------------------------------------------------
# app.localhost: aplicacion Expo web + API en el mismo origen
# -----------------------------------------------------------------------------
# Al servir el API en el mismo origen que la app, el navegador no necesita
# CORS para las llamadas del frontend.
server {
    listen 443 ssl;
    server_name app.localhost;

    include /etc/nginx/snippets/api-locations.conf;

    location / {
        set $frontend_upstream http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass $frontend_upstream;
    }
}

# -----------------------------------------------------------------------------
# profile.localhost: panel de cuenta Next.js (SSR)
# -----------------------------------------------------------------------------
# profile-web habla con el gateway por la red interna (http://gateway:8080),
# asi que este servidor no necesita exponer /api.
server {
    listen 443 ssl;
    server_name profile.localhost;

    location / {
        set $profile_web_upstream http://profile-web:3000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass $profile_web_upstream;
    }
}
