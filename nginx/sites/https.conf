# =============================================================================
# Servidor HTTPS :443 (Persona 2, Escenario 2: Reverse Proxy)
# =============================================================================
# Un solo host publico (https://localhost); la RUTA decide a que backend se
# enruta, tal como lo define la Layered View P3 ("Reverse Routing (/, /account,
# /api, /api/ws)"):
#
#   /api/ws                  -> gateway:8080 (WebSocket) -> socket-gateway
#   /api/*                   -> gateway:8080 (REST / GraphQL)
#   /account, /login         -> profile-web:3000 (Next.js SSR)
#   /_next/*, /icon.svg,     -> profile-web:3000 (recursos estaticos de Next.js)
#   /logo.png
#   /* (todo lo demas)       -> frontend:80 (Expo web, SPA)
#
# No hace falta cambiar el basePath de Next.js: /account y /login ya son las
# rutas reales de profile-web, y la app Expo no usa ninguna de esas rutas (sus
# recursos viven en /_expo/, /assets/, /favicon.ico e /index.html).
#
# Al compartir el mismo origen (https://localhost), el navegador no necesita
# CORS entre la app y el API.
#
# Los certificados y protocolos TLS vienen de conf.d/ssl.conf (Persona 1).
# =============================================================================

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name localhost;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # API Gateway: /api/ws (WebSocket) y /api/ (REST / GraphQL).
    include /etc/nginx/snippets/api-locations.conf;

    # -------------------------------------------------------------------------
    # profile-web (panel de cuenta Next.js)
    # -------------------------------------------------------------------------
    # Paginas: /account, /account/..., /login, /login/... (con o sin query).
    # Es una expresion regular para no capturar rutas como /accounting.
    location ~ ^/(account|login)(/|$) {
        include /etc/nginx/snippets/profile-web-proxy.conf;
    }

    # JavaScript, CSS y datos RSC que genera Next.js. "^~" evita que otra
    # expresion regular capture estas rutas.
    location ^~ /_next/ {
        include /etc/nginx/snippets/profile-web-proxy.conf;
    }

    # Icono (src/app/icon.svg) y logo (public/logo.png) del panel.
    location = /icon.svg {
        include /etc/nginx/snippets/profile-web-proxy.conf;
    }

    location = /logo.png {
        include /etc/nginx/snippets/profile-web-proxy.conf;
    }

    # -------------------------------------------------------------------------
    # frontend (app Expo web): todo lo que no coincide con lo anterior
    # -------------------------------------------------------------------------
    location / {
        set $frontend_upstream http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass $frontend_upstream;
    }
}
