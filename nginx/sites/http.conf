# =============================================================================
# Servidor HTTP :80: PROPIEDAD DE PERSONA 1 (Escenario 1, Secure Channel)
# =============================================================================
# TEMPORAL: redireccion basica a HTTPS para que el puerto 80 no sirva
# contenido en texto plano mientras se integra el escenario 1. Persona 1
# puede reemplazar este archivo (codigo de redireccion, excepciones, etc.).
#
# Mantener "location = /healthz": el healthcheck del contenedor en
# docker-compose.yml lo consulta por HTTP en el puerto 80.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # Healthcheck de Docker: responde sin redirigir y sin registrar en el log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 https://$host$request_uri;
    }
}
