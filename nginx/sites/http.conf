# =============================================================================
# nginx/sites/http.conf — Redireccion HTTP :80 -> HTTPS :443 (Persona 1)
# =============================================================================
# Escenario de seguridad 1: Secure Channel Pattern
#
# Cualquier peticion HTTP en texto plano sobre el puerto 80 es redirigida de
# forma permanente (301 Moved Permanently) hacia https://$host$request_uri,
# garantizando que credenciales, JWT y coordenadas no viajen sin cifrar.
#
# Se conserva "location = /healthz" para el healthcheck interno del contenedor
# en docker-compose.yml (wget -qO- http://127.0.0.1/healthz).
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost app.localhost profile.localhost _;

    # Healthcheck interno de Docker Compose: responde sin redirigir y sin log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Redireccion permanente obligatoria de HTTP (:80) a HTTPS (:443).
    # Nota RFC 6797 §7.2: HSTS NO debe enviarse sobre HTTP plano (solo en :443).
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 301 https://$host$request_uri;
    }
}
