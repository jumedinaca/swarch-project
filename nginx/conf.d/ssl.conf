# =============================================================================
# TLS: PROPIEDAD DE PERSONA 1 (Escenario 1, Secure Channel)
# =============================================================================
# TEMPORAL: configuracion minima para que :443 funcione mientras se integra el
# escenario 1. Persona 1 reemplaza este archivo completo (protocolos, cifrados,
# sesiones, OCSP, etc.).
#
# Certificados: el script nginx/docker-entrypoint.d/40-tls-certs.sh deja en
# /etc/nginx/tls/ los archivos cert.pem y key.pem:
#   - si existen nginx/certs/cert.pem y nginx/certs/key.pem (generados por
#     scripts/generate-certs.sh de Persona 1), usa esos;
#   - si no, genera un certificado autofirmado TEMPORAL dentro del contenedor.
# =============================================================================

ssl_certificate     /etc/nginx/tls/cert.pem;
ssl_certificate_key /etc/nginx/tls/key.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1h;
