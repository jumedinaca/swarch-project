# =============================================================================
# nginx/conf.d/ssl.conf — Parametros Criptograficos TLS 1.2 / 1.3 (Persona 1)
# =============================================================================
# Escenario de seguridad 1: Secure Channel Pattern (TLS / HTTPS & WSS)
# Tactica arquitectonica: Encrypt Data in Transit (Resist Attacks)
#
# Configura la terminacion TLS en el Reverse Proxy perimetral tanto para las
# peticiones REST/GraphQL/SSR (https://) como para las conexiones en tiempo
# real WebSocket (wss://).
#
# Certificados: nginx/docker-entrypoint.d/40-tls-certs.sh instala en
# /etc/nginx/tls/ los certificados generados por scripts/generate-certs.sh
# (montados desde nginx/certs/).
# =============================================================================

ssl_certificate     /etc/nginx/tls/cert.pem;
ssl_certificate_key /etc/nginx/tls/key.pem;

# --- Protocolos TLS permitidos ---
# Se deshabilitan explicitamente SSLv2, SSLv3, TLSv1.0 y TLSv1.1 para mitigar
# POODLE, BEAST y ataques de degradacion. Solo se negocia TLS 1.2 y TLS 1.3.
ssl_protocols TLSv1.2 TLSv1.3;

# --- Suites de cifrado (Forward Secrecy + AEAD) ---
# Para TLS 1.2 se exigen cifrados ECDHE autenticados con AEAD (AES-GCM y
# CHACHA20-POLY1305), descartando RC4, 3DES, MD5, NULL, EXPORT y modos CBC.
# TLS 1.3 negocia TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384 o
# TLS_CHACHA20_POLY1305_SHA256.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# --- Curvas elipticas para intercambio efimero ECDHE ---
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# --- Reanudacion y endurecimiento de sesiones TLS ---
# Se desactivan los session tickets para preservar Perfect Forward Secrecy (PFS).
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
