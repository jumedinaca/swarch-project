# =============================================================================
# Cabeceras que el proxy envia a los backends (Persona 2, Escenario 2)
# =============================================================================

# Conserva el nombre de host original (localhost).
# Next.js lo compara con Origin para aceptar las Server Actions.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;

# IP real del cliente. Detras del proxy, la conexion TCP que ve el backend
# viene de la IP de este contenedor, asi que sin estas cabeceras todos los
# clientes parecerian el mismo. El rate limiting del gateway (Escenario 4)
# lee X-Real-IP cuando RATE_LIMIT_TRUST_PROXY=true.
#
# Ambas se SOBREESCRIBEN con $remote_addr (la IP de la conexion que llega al
# proxy) en vez de anexarse a lo que envio el cliente: como este es el borde,
# cualquier X-Real-IP o X-Forwarded-For que traiga la peticion es falsificable
# y se descarta.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;

# Indica al backend que el cliente uso HTTPS (la conexion interna es HTTP).
proxy_set_header X-Forwarded-Proto $scheme;

# Defensa en profundidad: descarta cualquier token interno falsificado desde el borde.
proxy_set_header X-Internal-Token  "";
