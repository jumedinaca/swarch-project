# =============================================================================
# Cabeceras de seguridad comunes (Persona 2, Escenario 2)
# =============================================================================
# IMPORTANTE: Nginx NO hereda add_header de niveles superiores hacia un
# location que declara su propio add_header. Por eso estas cabeceras viven en
# un snippet que se incluye en CADA location, en vez de declararse una sola vez
# en el bloque server.
#
# "always" hace que se envien tambien en respuestas de error (4xx/5xx), que
# por defecto Nginx omite.
# =============================================================================

# Si un backend ya envia alguna de estas cabeceras se descarta su valor, para
# que el navegador reciba una sola version, la definida en el perimetro.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;

# Next.js (profile-web) anuncia "X-Powered-By: Next.js". Se elimina para no
# revelar la tecnologia de los backends. Va aqui y no solo en nginx.conf
# porque proxy_hide_header, igual que add_header, deja de heredarse cuando el
# location declara los suyos.
proxy_hide_header X-Powered-By;

# Prohibe que la aplicacion se muestre dentro de un <iframe> de otro sitio
# (defensa contra clickjacking).
add_header X-Frame-Options "DENY" always;

# Obliga al navegador a respetar el Content-Type declarado: evita que un
# archivo subido (p. ej. un avatar) se interprete como HTML o JavaScript.
add_header X-Content-Type-Options "nosniff" always;

# Al navegar hacia otros sitios solo se envia el origen, no la ruta completa,
# que podria contener identificadores o parametros sensibles.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS (Persona 1).
include /etc/nginx/snippets/hsts.conf;
