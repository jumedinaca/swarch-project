# =============================================================================
# Proxy hacia profile-web (Persona 2, Escenario 2)
# =============================================================================
# Se incluye dentro de cada location que pertenece al panel Next.js
# (ver sites/https.conf), para no repetir la configuracion.
#
# La variable hace que "profile-web" se resuelva con el DNS de Docker en cada
# peticion (ver "resolver" en nginx.conf). Sin ruta en la variable, Nginx
# reenvia la URI original completa (/account?demo=1, /_next/static/..., etc.).
# =============================================================================

set $profile_web_upstream http://profile-web:3000;

proxy_http_version 1.1;
proxy_set_header Connection "";

# Host y X-Forwarded-Host deben coincidir con el Origin del navegador
# (https://localhost) para que Next.js acepte las Server Actions.
include /etc/nginx/snippets/proxy-headers.conf;
include /etc/nginx/snippets/security-headers.conf;

proxy_pass $profile_web_upstream;
