# =============================================================================
# Rutas hacia el API Gateway (Persona 2, Escenario 2)
# =============================================================================
# Se incluyen en los servidores que exponen /api (localhost y app.localhost).
#
# proxy_pass usa una variable ($gateway_upstream) para que el nombre
# "gateway" se resuelva con el DNS de Docker en cada peticion (ver "resolver"
# en nginx.conf). Con una variable sin ruta, Nginx reenvia la URI original
# completa (/api/...), que es lo que espera el gateway.
# =============================================================================

# WebSocket de tiempo real: /api/ws -> gateway -> socket-gateway.
# Va antes que /api/ porque Nginx elige el prefijo mas largo.
location /api/ws {
    set $gateway_upstream http://gateway:8080;

    # El upgrade a WebSocket requiere HTTP/1.1 y reenviar explicitamente
    # Upgrade y Connection (son cabeceras hop-by-hop: Nginx no las reenvia
    # por su cuenta).
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Una conexion WebSocket abierta puede pasar mucho tiempo sin trafico
    # (el heartbeat la mantiene viva); con el timeout general de 60 s Nginx
    # la cortaria. 1 hora es el maximo de inactividad tolerado.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # proxy_set_header no se hereda si el location declara los suyos, por
    # eso se incluyen de nuevo las cabeceras comunes.
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/security-headers.conf;

    proxy_pass $gateway_upstream;
}

# API REST y GraphQL.
location /api/ {
    set $gateway_upstream http://gateway:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/security-headers.conf;

    proxy_pass $gateway_upstream;
}
