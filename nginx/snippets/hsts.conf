# =============================================================================
# nginx/snippets/hsts.conf — HTTP Strict Transport Security (Persona 1)
# =============================================================================
# Escenario de seguridad 1: Secure Channel Pattern
#
# RFC 6797: instruye al navegador a recordar durante 2 años (63072000 s) que
# este dominio y todos sus subdominios (app.localhost, profile.localhost) solo
# pueden accederse por HTTPS/WSS, previniendo ataques de SSL Stripping y
# degradacion de protocolo.
#
# Se incluye desde snippets/security-headers.conf con 'always' para que este
# presente en todas las respuestas HTTPS (2xx, 3xx, 4xx y 5xx).
# =============================================================================

proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
