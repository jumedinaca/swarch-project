# HSTS: PROPIEDAD DE PERSONA 1 (Escenario 1, Secure Channel)
# =============================================================================
# Vacio a proposito. Persona 1 agrega aqui la cabecera, por ejemplo:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Este archivo se incluye desde security-headers.conf, asi HSTS queda en todos
# los location que definen sus propias cabeceras (Nginx no hereda add_header
# hacia un location que declara las suyas).
