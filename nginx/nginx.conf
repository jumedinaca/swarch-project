# =============================================================================
# GeoPicto - Reverse Proxy perimetral (Escenario de seguridad 2)
# =============================================================================
# Patron Reverse Proxy: este contenedor es el UNICO punto de entrada HTTP(S)
# publicado al host. frontend, profile-web y gateway ya no publican puertos;
# solo se alcanzan desde aqui por la red interna de Docker. Asi:
#   - la superficie de ataque pasa de 3 puertos a 1 perimetro (:80/:443),
#   - las cabeceras de seguridad, los limites y los timeouts se aplican en un
#     solo lugar en vez de depender de cada servidor de aplicacion,
#   - los backends no revelan su tecnologia ni su version.
#
# Estructura de archivos (separada para evitar conflictos entre integrantes):
#   nginx.conf                     -> este archivo: global, hardening y rutas (Persona 2)
#   conf.d/ssl.conf                -> parametros TLS y certificados       (Persona 1)
#   snippets/hsts.conf             -> cabecera HSTS                        (Persona 1)
#   snippets/security-headers.conf -> cabeceras de seguridad comunes       (Persona 2)
#   snippets/proxy-headers.conf    -> cabeceras hacia los backends         (Persona 2)
#   sites/http.conf                -> servidor :80 (redireccion a HTTPS)   (Persona 1)
#   sites/https.conf               -> servidor :443, enrutamiento por ruta  (Persona 2)
#   snippets/profile-web-proxy.conf -> proxy hacia profile-web             (Persona 2)
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    # 4096 conexiones por worker soporta >2000 VUs concurrentes (cliente + upstream).
    worker_connections 4096;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;

    # -------------------------------------------------------------------------
    # Hardening: no revelar informacion del servidor
    # -------------------------------------------------------------------------
    # Quita la version de Nginx de la cabecera Server y de las paginas de error,
    # para que un atacante no pueda buscar vulnerabilidades de esa version.
    server_tokens off;

    # Next.js (profile-web) anuncia "X-Powered-By: Next.js". Se elimina en el
    # borde para no revelar la tecnologia de los backends. (Se repite en
    # snippets/security-headers.conf porque los location que declaran su
    # propio proxy_hide_header no heredan este.)
    proxy_hide_header X-Powered-By;

    # -------------------------------------------------------------------------
    # Hardening: limites de tamano y de tiempo
    # -------------------------------------------------------------------------
    # El servicio de perfiles acepta avatares de hasta 5 MB; 6 MB deja margen
    # para el encabezado multipart. Cualquier cuerpo mayor se rechaza aqui con
    # 413, sin consumir ancho de banda ni memoria de los microservicios.
    client_max_body_size 6M;

    # Mitigan conexiones lentas (estilo Slowloris): si el cliente tarda en
    # enviar cabeceras o cuerpo, Nginx corta la conexion en vez de mantener
    # recursos ocupados indefinidamente.
    client_header_timeout 15s;
    client_body_timeout   15s;
    # Tiempo maximo entre dos escrituras hacia el cliente.
    send_timeout          30s;
    keepalive_timeout     30s;

    # Timeouts hacia los backends: si un servicio no acepta la conexion en 5 s
    # o no responde en 60 s, el proxy responde 502/504 en vez de colgarse.
    # El WebSocket sobreescribe proxy_read_timeout en su propio location.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # -------------------------------------------------------------------------
    # Resolucion dinamica de los backends
    # -------------------------------------------------------------------------
    # 127.0.0.11 es el DNS interno de Docker. Junto con variables en
    # proxy_pass, hace que Nginx resuelva el nombre del contenedor en cada
    # peticion (cache de 10 s) en vez de una sola vez al arrancar:
    #   - Nginx arranca aunque un backend aun no exista,
    #   - si un backend se reinicia y cambia de IP, no se usan IPs viejas.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # WebSocket
    # -------------------------------------------------------------------------
    # Solo se pide "Connection: upgrade" al backend cuando el cliente realmente
    # pidio un upgrade; el resto de peticiones usan "Connection: close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Parametros TLS (Persona 1). Se aplican a todos los servidores :443.
    include /etc/nginx/conf.d/*.conf;

    # Servidores virtuales.
    include /etc/nginx/sites/*.conf;
}
