# Rating aislado: servicio + PostgreSQL + RabbitMQ.
#
#   docker compose up --build
#
# Sin gateway no hay JWT: las peticiones llevan X-User-ID a mano (ver README).
name: geopicto-rating

services:
  rating:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@rating-db:5432/rating?sslmode=disable
      RABBITMQ_URL: amqp://geopicto:geopicto@rabbitmq:5672/geopicto
      RABBITMQ_EXCHANGE: geopicto.events
    depends_on:
      rating-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8102:8080"

  rating-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rating
    ports:
      - "5437:5432"
    volumes:
      - rating_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rating"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: geopicto
      RABBITMQ_DEFAULT_PASS: geopicto
      RABBITMQ_DEFAULT_VHOST: geopicto
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rating_data:
