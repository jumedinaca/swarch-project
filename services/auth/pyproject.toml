[project]
name = "auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pydantic[email]>=2.9,<3.0",
    "pyjwt>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.6,<3.0",
    "pydantic[email]>=2.9,<3.0",
    "pyjwt>=2.10,<3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32,<1.0",
]
