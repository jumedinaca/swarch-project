name: geopicto-auth

services:
  auth:
    build: .
    container_name: auth

    env_file:
      - .env

    depends_on:
      auth-db:
        condition: service_healthy

    ports:
      - "8200:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:18-alpine

    container_name: auth_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth

    # ports:
    #   - "5433:5432"

    volumes:
      - auth_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d auth"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_data:
