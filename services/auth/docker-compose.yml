name: geopicto-auth

services:
  auth:
    build: .
    container_name: auth

    env_file:
      - .env

    environment:
      RABBITMQ_URL: amqp://geopicto:geopicto@rabbitmq:5672/geopicto
      RABBITMQ_EXCHANGE: geopicto.events

    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8200:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:18-alpine

    container_name: auth_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth

    ports:
      - "5433:5432"

    volumes:
      - auth_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d auth"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: auth_rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: geopicto
      RABBITMQ_DEFAULT_PASS: geopicto
      RABBITMQ_DEFAULT_VHOST: geopicto

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  auth_data:
