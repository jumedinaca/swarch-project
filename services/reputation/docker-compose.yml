name: geopicto-reputation

services:
  reputation:
    build: .
    container_name: reputation
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@reputation-db:5432/reputation?sslmode=disable
      RABBITMQ_URL: amqp://geopicto:geopicto@rabbitmq:5672/geopicto
      RABBITMQ_EXCHANGE: geopicto.events
    depends_on:
      reputation-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8600:8080"
    volumes:
      - .:/app
    command: air -c .air.toml

  reputation-db:
    image: postgres:18-alpine
    container_name: reputation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reputation
    ports:
      - "5436:5432"
    volumes:
      - reputation_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reputation"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: reputation_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: geopicto
      RABBITMQ_DEFAULT_PASS: geopicto
      RABBITMQ_DEFAULT_VHOST: geopicto
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  reputation_data:
