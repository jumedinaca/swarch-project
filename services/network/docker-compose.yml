services:

  network:
    build: .
    container_name: network
    ports:
      - "8001:8000"

    environment:
      APP_NAME: ${APP_NAME}
      PORT: ${PORT}
      # --- Database ---
      MONGO_HOST: "network-db:27017"
      MONGO_DB: ${MONGO_DB}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

      # --- Security / JWT ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-geopicto-auth}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-10}

      # --- RabbitMQ ---
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://geopicto:geopicto@rabbitmq:5672/geopicto}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-geopicto.events}

      # --- CORS ---
      CORS_ORIGINS: "*"

    depends_on:
      network-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  network-db:
    image: mongo
    container_name: network-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: network_db
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - network_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: network-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: geopicto
      RABBITMQ_DEFAULT_PASS: geopicto
      RABBITMQ_DEFAULT_VHOST: geopicto
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - network_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  network_mongo_data:
  network_rabbitmq_data:
