[project]
name = "profile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "minio>=7.2,<8.0",
    "pillow>=11.0",
    "pydantic-settings>=2.6,<3.0",
    "pydantic>=2.9,<3.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
