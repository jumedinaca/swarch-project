services:
  messages:
    build:
      context: .
      target: development
    container_name: messages

    env_file:
      - .env

    depends_on:
      messages-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8100:8080"

    volumes:
      - .:/app

      # Evita que tmp/ y otros archivos generados
      # sean un problema con el bind mount.
      # go_tmp:/app/tmp

    command: air -c .air.toml

  messages-db:
    image: postgis/postgis:18-3.6

    container_name: messages_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messages

    # ports:
    #   - "5432:5432"

    volumes:
      - messages_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d messages"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: messages_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: geopicto
      RABBITMQ_DEFAULT_PASS: geopicto
      RABBITMQ_DEFAULT_VHOST: geopicto
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - messages_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  messages_data:
  messages_rabbitmq_data:
