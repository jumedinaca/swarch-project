[project]
name = "email"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.1",
    "aiosmtplib>=3.0,<5.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pydantic[email]>=2.9,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
