# Entorno completo de GeoPicto: frontend web, API Gateway y los servicios de
# autenticacion, mensajes y red social con sus bases de datos, todos en la
# misma red.
#
#   docker compose up --build
#
# No requiere configuracion previa: JWT_SECRET tiene un valor por defecto para
# el prototipo (ver x-jwt-secret abajo). Para usar uno propio, define
# JWT_SECRET en un archivo .env (ver .env.example).
#
# Solo se publican al host el gateway (:8080) y el frontend (:8081). Los
# servicios internos se alcanzan unicamente a traves del gateway, que es quien
# valida el JWT y agrega X-User-ID.
#
# Cada componente conserva su propio docker-compose.yml para trabajar de forma
# aislada; este archivo es el que levanta el sistema completo.

name: geopicto

# Secreto HS256 compartido: auth firma los JWT y el gateway los verifica, asi
# que ambos deben recibir el mismo valor. El valor por defecto es solo para
# ejecutar el prototipo en local; en cualquier entorno compartido se debe
# definir JWT_SECRET en .env (minimo 32 bytes).
x-jwt-secret: &jwt-secret ${JWT_SECRET:-geopicto-prototipo-secreto-local-no-usar-en-produccion}

services:
  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    volumes:
      - auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth
      PORT: "8080"
      # Mismo secreto que el gateway: el gateway verifica con el los tokens que
      # firma este servicio.
      JWT_SECRET: *jwt-secret
      # Vacio a proposito: el gateway agrega las cabeceras CORS. Si ambos las
      # pusieran, el navegador rechazaria las respuestas.
      CORS_ORIGINS: ""
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  messages-db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messages
    volumes:
      - messages_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messages"]
      interval: 5s
      timeout: 5s
      retries: 10

  messages:
    build: ./services/messages
    environment:
      DATABASE_URL: postgres://postgres:postgres@messages-db:5432/messages?sslmode=disable
      PORT: "8080"
    depends_on:
      messages-db:
        condition: service_healthy
    healthcheck:
      # El servicio no tiene endpoint de salud propio; una busqueda vacia
      # comprueba a la vez que la API responde y que la base de datos esta lista.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/messages/nearby?lat=0&lng=0&radius=1' || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 5

  network-db:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: network_db
      MONGO_INITDB_ROOT_USERNAME: network_admin
      MONGO_INITDB_ROOT_PASSWORD: network_admin
    volumes:
      - network_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  network:
    build: ./services/network
    environment:
      APP_NAME: network
      PORT: "8080"
      # Cualquier valor distinto de development exige X-User-ID (lo pone el gateway)
      APP_ENV: production
      MONGO_HOST: network-db:27017
      MONGO_DB: network_db
      MONGO_ROOT_USERNAME: network_admin
      MONGO_ROOT_PASSWORD: network_admin
      # Vacio a proposito: el gateway agrega las cabeceras CORS.
      CORS_ORIGINS: ""
    depends_on:
      network-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  gateway:
    build: ./gateway
    environment:
      JWT_SECRET: *jwt-secret
      MESSAGES_SERVICE_URL: http://messages:8080
      AUTH_SERVICE_URL: http://auth:8080
      NETWORK_SERVICE_URL: http://network:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_healthy
      messages:
        condition: service_healthy
      network:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Expo incrusta las variables EXPO_PUBLIC_* al compilar, por eso van
        # como argumentos de build y no como variables de entorno del contenedor.
        EXPO_PUBLIC_API_GATEWAY_URL: ${EXPO_PUBLIC_API_GATEWAY_URL:-http://localhost:8080}
        EXPO_PUBLIC_USE_MOCK_DATA: ${EXPO_PUBLIC_USE_MOCK_DATA:-false}
    ports:
      - "8081:80"
    depends_on:
      - gateway

volumes:
  auth_data:
  messages_data:
  network_data:
