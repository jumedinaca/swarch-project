server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Las rutas se evaluan en orden; la primera cuyos predicates calcen gana.
          # Por eso "messages-nearby" (publica) va antes que "messages-protected"
          # (exige JWT), que matchea el resto de /api/messages/**.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8101}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: messages-nearby
              uri: ${MESSAGES_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/api/messages/nearby
                - Method=GET
              filters:
                - StripPrefix=1

            - id: messages-protected
              uri: ${MESSAGES_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/api/messages/**
              filters:
                - StripPrefix=1
                - JwtAuth

            # Servicio de red social (amigos y solicitudes): solo expone GraphQL.
            # /api/network/graphql -> /graphql. Exige JWT.
            - id: network-graphql
              uri: ${NETWORK_SERVICE_URL:http://localhost:8001}
              predicates:
                - Path=/api/network/graphql
              filters:
                - StripPrefix=2
                - JwtAuth

            # Avatares: publicos porque las etiquetas <img> no envian el JWT.
            # Va antes de "profiles-protected", que matchea el resto de /api/profiles/**.
            - id: profiles-avatars
              uri: ${PROFILE_SERVICE_URL:http://localhost:8300}
              predicates:
                - Path=/api/profiles/avatars/**
                - Method=GET
              filters:
                - StripPrefix=1

            - id: profiles-protected
              uri: ${PROFILE_SERVICE_URL:http://localhost:8300}
              predicates:
                - Path=/api/profiles/**
              filters:
                - StripPrefix=1
                - JwtAuth

            # Servicio de calificaciones (likes/dislikes sobre mensajes).
            # /api/ratings/** -> /ratings/**. Exige JWT.
            - id: rating-service
              uri: ${RATING_SERVICE_URL:http://localhost:8102}
              predicates:
                - Path=/api/ratings/**
              filters:
                - StripPrefix=1
                - JwtAuth

            # Servicio de reputacion y niveles de explorador.
            # /api/reputation/** -> /reputation/**. Exige JWT.
            - id: reputation-service
              uri: ${REPUTATION_SERVICE_URL:http://localhost:8600}
              predicates:
                - Path=/api/reputation/**
              filters:
                - StripPrefix=1
                - JwtAuth

            # Emision de tickets efimeros para autenticar el WebSocket.
            # POST /api/socket/tickets -> POST /tickets. Exige JWT.
            - id: socket-tickets
              uri: ${SOCKET_GATEWAY_HTTP_URL:http://localhost:8700}
              predicates:
                - Path=/api/socket/tickets
              filters:
                - StripPrefix=2
                - JwtAuth

            # Handshake y conexion WebSocket (/api/ws -> /ws).
            # No lleva JwtAuth porque el navegador no envia Authorization en el handshake;
            # socket-gateway valida el ticket efimero de un solo uso (?ticket=...).
            - id: socket-ws
              uri: ${SOCKET_GATEWAY_WS_URL:ws://localhost:8700}
              predicates:
                - Path=/api/ws, /api/ws/**
              filters:
                - StripPrefix=1

          # El frontend envia el JWT en el header Authorization (no usa cookies),
          # por eso no se habilita allowCredentials.
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8082,http://127.0.0.1:8081,http://127.0.0.1:8082}
                # PATCH lo usa PATCH /api/profiles/me
                allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowedHeaders: "*"

# Secreto HS256 compartido con el microservicio de autenticacion para firmar
# los JWT. Es obligatorio (minimo 32 bytes): el gateway no arranca sin el.
jwt:
  secret: ${JWT_SECRET:}
  # Valor exigido en el claim "iss": solo se aceptan tokens del servicio de autenticacion.
  issuer: ${JWT_ISSUER:geopicto-auth}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.cloud.gateway: INFO
