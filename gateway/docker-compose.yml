services:
  gateway:
    build: .
    container_name: gateway

    env_file:
      - .env

    ports:
      - "8080:8080"

    depends_on:
      redis:
        condition: service_healthy

  # Redis compartido para Rate Limiting (Escenario 4) y Token Blacklist
  # (Escenario 5). En el sistema completo este servicio lo define el
  # docker-compose.yml de la raíz.
  redis:
    image: redis:7-alpine
    container_name: gateway_redis

    ports:
      - "6381:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
