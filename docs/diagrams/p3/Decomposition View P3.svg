<rect x="24" y="20" width="292" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
<text x="170" y="39" font-size="13" fill="#000000" text-anchor="middle">Decomposition view - GeoPicto (Prototype 3)</text>
<rect x="565.0" y="24" width="250" height="50" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2" filter="url(#shadow)"/><text x="690.0" y="54.5" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">GeoPicto</text><line x1="690.0" y1="74" x2="690.0" y2="98" stroke="#111111" stroke-width="2.6"/><line x1="145.0" y1="98" x2="1245.0" y2="98" stroke="#111111" stroke-width="2.6"/><line x1="145.0" y1="98" x2="145.0" y2="122" stroke="#111111" stroke-width="2.4"/><rect x="52" y="122" width="186" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" filter="url(#shadow)"/><text x="145.0" y="148.5" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Auth</text><path d="M 52,145.0 L 36,145.0 L 36,416.0" fill="none" stroke="#111111" stroke-width="2.2"/><line x1="36" y1="218.0" x2="52" y2="218.0" stroke="#111111" stroke-width="2.2"/><rect x="52" y="192" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="145.0" y="214.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Register a new</text><text x="145.0" y="227.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">user account</text><line x1="36" y1="284.0" x2="52" y2="284.0" stroke="#111111" stroke-width="2.2"/><rect x="52" y="258" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="145.0" y="280.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Log in with username</text><text x="145.0" y="293.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">or email</text><line x1="36" y1="350.0" x2="52" y2="350.0" stroke="#111111" stroke-width="2.2"/><rect x="52" y="324" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="145.0" y="346.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Log out of the</text><text x="145.0" y="359.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">platform</text><line x1="36" y1="416.0" x2="52" y2="416.0" stroke="#111111" stroke-width="2.2"/><rect x="52" y="390" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="145.0" y="412.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Change account</text><text x="145.0" y="425.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">password</text><line x1="365.0" y1="98" x2="365.0" y2="122" stroke="#111111" stroke-width="2.4"/><rect x="272" y="122" width="186" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" filter="url(#shadow)"/><text x="365.0" y="148.5" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Messages</text><path d="M 272,145.0 L 256,145.0 L 256,416.0" fill="none" stroke="#111111" stroke-width="2.2"/><line x1="256" y1="218.0" x2="272" y2="218.0" stroke="#111111" stroke-width="2.2"/><rect x="272" y="192" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="365.0" y="214.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Explore nearby</text><text x="365.0" y="227.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">messages on the map</text><line x1="256" y1="284.0" x2="272" y2="284.0" stroke="#111111" stroke-width="2.2"/><rect x="272" y="258" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="365.0" y="280.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Filter messages by</text><text x="365.0" y="293.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">proximity radius</text><line x1="256" y1="350.0" x2="272" y2="350.0" stroke="#111111" stroke-width="2.2"/><rect x="272" y="324" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="365.0" y="346.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Publish a message at</text><text x="365.0" y="359.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">the user&#x27;s location</text><line x1="256" y1="416.0" x2="272" y2="416.0" stroke="#111111" stroke-width="2.2"/><rect x="272" y="390" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="365.0" y="412.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">View details and</text><text x="365.0" y="425.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">delete own messages</text><line x1="585.0" y1="98" x2="585.0" y2="122" stroke="#111111" stroke-width="2.4"/><rect x="492" y="122" width="186" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" filter="url(#shadow)"/><text x="585.0" y="148.5" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Network</text><path d="M 492,145.0 L 476,145.0 L 476,416.0" fill="none" stroke="#111111" stroke-width="2.2"/><line x1="476" y1="218.0" x2="492" y2="218.0" stroke="#111111" stroke-width="2.2"/><rect x="492" y="192" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="585.0" y="214.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Send a friend request</text><text x="585.0" y="227.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">to another user</text><line x1="476" y1="284.0" x2="492" y2="284.0" stroke="#111111" stroke-width="2.2"/><rect x="492" y="258" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="585.0" y="280.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Accept, reject, or</text><text x="585.0" y="293.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">cancel friend requests</text><line x1="476" y1="350.0" x2="492" y2="350.0" stroke="#111111" stroke-width="2.2"/><rect x="492" y="324" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="585.0" y="346.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">View friends list and</text><text x="585.0" y="359.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">pending requests</text><line x1="476" y1="416.0" x2="492" y2="416.0" stroke="#111111" stroke-width="2.2"/><rect x="492" y="390" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="585.0" y="412.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Remove a user from</text><text x="585.0" y="425.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">the friends list</text><line x1="805.0" y1="98" x2="805.0" y2="122" stroke="#111111" stroke-width="2.4"/><rect x="712" y="122" width="186" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" filter="url(#shadow)"/><text x="805.0" y="148.5" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Profile</text><path d="M 712,145.0 L 696,145.0 L 696,350.0" fill="none" stroke="#111111" stroke-width="2.2"/><line x1="696" y1="218.0" x2="712" y2="218.0" stroke="#111111" stroke-width="2.2"/><rect x="712" y="192" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="805.0" y="214.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">View and edit display</text><text x="805.0" y="227.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">name, bio, and color</text><line x1="696" y1="284.0" x2="712" y2="284.0" stroke="#111111" stroke-width="2.2"/><rect x="712" y="258" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="805.0" y="280.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Upload and update</text><text x="805.0" y="293.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">profile avatar</text><line x1="696" y1="350.0" x2="712" y2="350.0" stroke="#111111" stroke-width="2.2"/><rect x="712" y="324" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="805.0" y="346.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Search other user</text><text x="805.0" y="359.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">profiles</text><line x1="1025.0" y1="98" x2="1025.0" y2="122" stroke="#111111" stroke-width="2.4"/><rect x="932" y="122" width="186" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" filter="url(#shadow)"/><text x="1025.0" y="148.5" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Rating</text><path d="M 932,145.0 L 916,145.0 L 916,350.0" fill="none" stroke="#111111" stroke-width="2.2"/><line x1="916" y1="218.0" x2="932" y2="218.0" stroke="#111111" stroke-width="2.2"/><rect x="932" y="192" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="1025.0" y="214.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Like or dislike</text><text x="1025.0" y="227.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">a message</text><line x1="916" y1="284.0" x2="932" y2="284.0" stroke="#111111" stroke-width="2.2"/><rect x="932" y="258" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="1025.0" y="280.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">Update or remove</text><text x="1025.0" y="293.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">a rating</text><line x1="916" y1="350.0" x2="932" y2="350.0" stroke="#111111" stroke-width="2.2"/><rect x="932" y="324" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="1025.0" y="346.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">View message like</text><text x="1025.0" y="359.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">and dislike counts</text><line x1="1245.0" y1="98" x2="1245.0" y2="122" stroke="#111111" stroke-width="2.4"/><rect x="1152" y="122" width="186" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" filter="url(#shadow)"/><text x="1245.0" y="148.5" font-size="12" font-weight="700" fill="#111111" text-anchor="middle">Reputation</text><path d="M 1152,145.0 L 1136,145.0 L 1136,350.0" fill="none" stroke="#111111" stroke-width="2.2"/><line x1="1136" y1="218.0" x2="1152" y2="218.0" stroke="#111111" stroke-width="2.2"/><rect x="1152" y="192" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="1245.0" y="214.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">View explorer score</text><text x="1245.0" y="227.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">and level progress</text><line x1="1136" y1="284.0" x2="1152" y2="284.0" stroke="#111111" stroke-width="2.2"/><rect x="1152" y="258" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="1245.0" y="280.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">View earned or lost</text><text x="1245.0" y="293.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">points history</text><line x1="1136" y1="350.0" x2="1152" y2="350.0" stroke="#111111" stroke-width="2.2"/><rect x="1152" y="324" width="186" height="52" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.2" filter="url(#shadow)"/><text x="1245.0" y="346.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">View leaderboard</text><text x="1245.0" y="359.0" font-size="10" font-weight="400" fill="#111111" text-anchor="middle">ranking</text><rect x="460.0" y="476" width="460" height="118" rx="22" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text x="484.0" y="500" font-size="11.5" font-weight="700" fill="#111111">Convention</text><rect x="484.0" y="514" width="86" height="26" rx="5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="527.0" y="529.0" font-size="9" font-weight="400" fill="#111111" text-anchor="middle"></text><text x="580.0" y="531" font-size="10.5" fill="#111111">Root</text><rect x="690.0" y="514" width="86" height="26" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="733.0" y="529.0" font-size="9" font-weight="400" fill="#111111" text-anchor="middle"></text><text x="786.0" y="531" font-size="10.5" fill="#111111">Modules</text><rect x="484.0" y="554" width="86" height="26" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="527.0" y="569.0" font-size="9" font-weight="400" fill="#111111" text-anchor="middle"></text><text x="580.0" y="571" font-size="10.5" fill="#111111">Functionalities</text><line x1="706.0" y1="580" x2="758.0" y2="548" stroke="#111111" stroke-width="2.0"/><text x="772.0" y="571" font-size="10.5" fill="#111111">Is part of</text></svg>