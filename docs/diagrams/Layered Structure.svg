<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="720" y="38" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Layered Structure View — GeoPicto</text>
  <text x="720" y="62" font-size="13" fill="#64748B" text-anchor="middle">Estructura de 4 Capas Macro (Cortes Verticales de Microservicios) y Microarquitectura Interna</text>

  <!-- ==================== MACRO LAYER 1 ==================== -->
  <g id="macro-layer1" filter="url(#shadow)">
    <rect x="50" y="85" width="1340" height="95" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" />
    <rect x="50" y="85" width="1340" height="26" rx="8" fill="#FCA5A5" />
    <text x="65" y="103" font-size="12" font-weight="bold" fill="#991B1B">CAPA 1: PRESENTACIÓN / CLIENTES (Presentation Layer)</text>

    <!-- Mobile -->
    <rect x="180" y="120" width="420" height="48" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <text x="390" y="140" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">geopicto-mobile (React Native / Expo)</text>
    <text x="390" y="156" font-size="10" fill="#64748B" text-anchor="middle">App Móvil iOS / Android | TypeScript | APIs Nativas de Geolocalización</text>

    <!-- Web SSR -->
    <rect x="840" y="120" width="420" height="48" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <text x="1050" y="140" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">geopicto-web (Next.js SSR)</text>
    <text x="1050" y="156" font-size="10" fill="#64748B" text-anchor="middle">Frontend Web | TypeScript | Server-Side Rendering &amp; Client Hydration</text>
  </g>

  <!-- CONNECTOR L1 -> L2 -->
  <line x1="720" y1="180" x2="720" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="187" width="240" height="16" rx="4" fill="#F1F5F9" />
  <text x="720" y="199" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">HTTPS / REST | GraphQL | WebSocket</text>

  <!-- ==================== MACRO LAYER 2 ==================== -->
  <g id="macro-layer2" filter="url(#shadow)">
    <rect x="50" y="215" width="1340" height="90" rx="8" fill="#F3E8FF" stroke="#A855F7" stroke-width="2" />
    <rect x="50" y="215" width="1340" height="26" rx="8" fill="#E9D5FF" />
    <text x="65" y="233" font-size="12" font-weight="bold" fill="#6B21A8">CAPA 2: BORDE, ENRUTAMIENTO Y SEGURIDAD (API Gateway &amp; Edge Layer)</text>

    <rect x="180" y="250" width="1080" height="45" rx="6" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5" />
    <text x="720" y="268" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">api-gateway (Java 21 — Spring Cloud Gateway)</text>
    <text x="720" y="284" font-size="10" fill="#64748B" text-anchor="middle">Punto Único de Entrada | Validación Criptográfica JWT | Inyección Header X-User-ID | Enrutamiento Dinámico | Rate Limiter</text>
  </g>

  <!-- CONNECTOR L2 -> L3 -->
  <line x1="720" y1="305" x2="720" y2="335" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="580" y="312" width="280" height="16" rx="4" fill="#F1F5F9" />
  <text x="720" y="324" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">HTTP Interno (con X-User-ID) | GraphQL | WS</text>

  <!-- ==================== MACRO LAYER 3 ==================== -->
  <g id="macro-layer3" filter="url(#shadow)">
    <rect x="50" y="340" width="1340" height="155" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" />
    <rect x="50" y="340" width="1340" height="26" rx="8" fill="#BFDBFE" />
    <text x="65" y="358" font-size="12" font-weight="bold" fill="#1E40AF">CAPA 3: SERVICIOS DE NEGOCIO / MICROSERVICIOS (Business Services Layer — Cortes Verticales Autónomos)</text>

    <g transform="translate(65, 378)">
      <!-- auth -->
      <rect x="0" y="0" width="135" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="67" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">auth</text>
      <text x="67" y="35" font-size="10" fill="#2563EB" text-anchor="middle">FastAPI (Python)</text>
      <text x="67" y="55" font-size="9" fill="#475569" text-anchor="middle">Identidad &amp; Login</text>
      <text x="67" y="70" font-size="9" fill="#475569" text-anchor="middle">Argon2id &amp; Sesiones</text>
      <text x="67" y="85" font-size="9" fill="#475569" text-anchor="middle">Emisión de JWT</text>

      <!-- messages -->
      <rect x="150" y="0" width="135" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="217" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">messages</text>
      <text x="217" y="35" font-size="10" fill="#2563EB" text-anchor="middle">net/http (Go)</text>
      <text x="217" y="55" font-size="9" fill="#475569" text-anchor="middle">Mensajes Geo</text>
      <text x="217" y="70" font-size="9" fill="#475569" text-anchor="middle">Búsqueda cercana</text>
      <text x="217" y="85" font-size="9" fill="#475569" text-anchor="middle">PostGIS ST_DWithin</text>

      <!-- network -->
      <rect x="300" y="0" width="135" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="367" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">network</text>
      <text x="367" y="35" font-size="10" fill="#2563EB" text-anchor="middle">Strawberry (Python)</text>
      <text x="367" y="55" font-size="9" fill="#475569" text-anchor="middle">API GraphQL</text>
      <text x="367" y="70" font-size="9" fill="#475569" text-anchor="middle">Grafo de Amistades</text>
      <text x="367" y="85" font-size="9" fill="#475569" text-anchor="middle">Máquina de estados</text>

      <!-- profile -->
      <rect x="450" y="0" width="135" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="517" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">profile</text>
      <text x="517" y="35" font-size="10" fill="#2563EB" text-anchor="middle">FastAPI (Python)</text>
      <text x="517" y="55" font-size="9" fill="#475569" text-anchor="middle">Perfil Público</text>
      <text x="517" y="70" font-size="9" fill="#475569" text-anchor="middle">Avatar &amp; MinIO S3</text>
      <text x="517" y="85" font-size="9" fill="#475569" text-anchor="middle">Color determinístico</text>

      <!-- rating -->
      <rect x="600" y="0" width="130" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="665" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">rating</text>
      <text x="665" y="35" font-size="10" fill="#2563EB" text-anchor="middle">REST (Node.js/TS)</text>
      <text x="665" y="55" font-size="9" fill="#475569" text-anchor="middle">Likes / Dislikes</text>
      <text x="665" y="70" font-size="9" fill="#475569" text-anchor="middle">Bloqueo auto-voto</text>
      <text x="665" y="85" font-size="9" fill="#475569" text-anchor="middle">Emite rating.changed</text>

      <!-- reputation -->
      <rect x="745" y="0" width="135" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="812" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">reputation</text>
      <text x="812" y="35" font-size="10" fill="#2563EB" text-anchor="middle">net/http (Go)</text>
      <text x="812" y="55" font-size="9" fill="#475569" text-anchor="middle">Score (0 - 1000)</text>
      <text x="812" y="70" font-size="9" fill="#475569" text-anchor="middle">Niveles &amp; Ledgers</text>
      <text x="812" y="85" font-size="9" fill="#475569" text-anchor="middle">Consumo AMQP</text>

      <!-- moderation -->
      <rect x="895" y="0" width="130" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="960" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">moderation</text>
      <text x="960" y="35" font-size="10" fill="#2563EB" text-anchor="middle">NLP ML (Python)</text>
      <text x="960" y="55" font-size="9" fill="#475569" text-anchor="middle">Clasificador ML</text>
      <text x="960" y="70" font-size="9" fill="#475569" text-anchor="middle">ALLOW / BLOCK</text>
      <text x="960" y="85" font-size="9" fill="#475569" text-anchor="middle">Filtro de seguridad</text>

      <!-- realtime -->
      <rect x="1040" y="0" width="130" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="1105" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">realtime</text>
      <text x="1105" y="35" font-size="10" fill="#2563EB" text-anchor="middle">WebSocket (Node/Elixir)</text>
      <text x="1105" y="55" font-size="9" fill="#475569" text-anchor="middle">Push en Vivo</text>
      <text x="1105" y="70" font-size="9" fill="#475569" text-anchor="middle">Canales WS</text>
      <text x="1105" y="85" font-size="9" fill="#475569" text-anchor="middle">Presencia activa</text>

      <!-- email -->
      <rect x="1185" y="0" width="125" height="100" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="1247" y="20" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">email</text>
      <text x="1247" y="35" font-size="10" fill="#2563EB" text-anchor="middle">Async Worker</text>
      <text x="1247" y="55" font-size="9" fill="#475569" text-anchor="middle">Mails bienvenida</text>
      <text x="1247" y="70" font-size="9" fill="#475569" text-anchor="middle">Notificaciones</text>
      <text x="1247" y="85" font-size="9" fill="#475569" text-anchor="middle">Reintentos &amp; DLQ</text>
    </g>
  </g>

  <!-- CONNECTOR L3 -> L4 -->
  <line x1="720" y1="495" x2="720" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="520" y="502" width="400" height="16" rx="4" fill="#F1F5F9" />
  <text x="720" y="514" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Conexiones TCP Privadas: SQL (5432) | MongoDB (27017) | AMQP (5672) | Redis (6379)</text>

  <!-- ==================== MACRO LAYER 4 ==================== -->
  <g id="macro-layer4" filter="url(#shadow)">
    <rect x="50" y="530" width="1340" height="120" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2" />
    <rect x="50" y="530" width="1340" height="26" rx="8" fill="#E2E8F0" />
    <text x="65" y="548" font-size="12" font-weight="bold" fill="#334155">CAPA 4: PERSISTENCIA, DATOS E INFRAESTRUCTURA (Persistence, Data &amp; Broker Layer)</text>

    <g transform="translate(70, 568)">
      <!-- PostgreSQL -->
      <rect x="0" y="0" width="370" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" />
      <text x="185" y="24" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Bases de Datos Relacionales (SQL)</text>
      <text x="185" y="42" font-size="10" fill="#1D4ED8" text-anchor="middle">PostgreSQL 16 / 18 + PostGIS (Puerto 5432)</text>
      <text x="185" y="58" font-size="9" fill="#475569" text-anchor="middle">auth-db, messages-db, reputation-db, profile-db, rating-db, moderation-db</text>

      <!-- MongoDB -->
      <rect x="400" y="0" width="230" height="70" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" />
      <text x="515" y="24" font-size="12" font-weight="bold" fill="#15803D" text-anchor="middle">Base NoSQL Documental</text>
      <text x="515" y="42" font-size="10" fill="#15803D" text-anchor="middle">MongoDB 7 (Puerto 27017)</text>
      <text x="515" y="58" font-size="9" fill="#475569" text-anchor="middle">network-db (Colección friendships)</text>

      <!-- RabbitMQ -->
      <rect x="660" y="0" width="310" height="70" rx="6" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5" />
      <text x="815" y="24" font-size="12" font-weight="bold" fill="#7E22CE" text-anchor="middle">Broker de Mensajería Asíncrona</text>
      <text x="815" y="42" font-size="10" fill="#7E22CE" text-anchor="middle">RabbitMQ 3.13 (AMQP - Puerto 5672)</text>
      <text x="815" y="58" font-size="9" fill="#475569" text-anchor="middle">Exchange geopicto.events &amp; Colas durables</text>

      <!-- Redis -->
      <rect x="1000" y="0" width="290" height="70" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5" />
      <text x="1145" y="24" font-size="12" font-weight="bold" fill="#C2410C" text-anchor="middle">Cache &amp; Presencia en Memoria</text>
      <text x="1145" y="42" font-size="10" fill="#C2410C" text-anchor="middle">Redis 7 (Puerto 6379)</text>
      <text x="1145" y="58" font-size="9" fill="#475569" text-anchor="middle">realtime-store (Sesiones WS y Estado)</text>
    </g>
  </g>

  <!-- ==================== ZOOM-IN: MICROARQUITECTURA INTERNA ==================== -->
  <g id="internal-zoom" filter="url(#shadow)">
    <rect x="50" y="695" width="1340" height="230" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2" />
    <rect x="50" y="695" width="1340" height="26" rx="8" fill="#BBF7D0" />
    <text x="65" y="713" font-size="12" font-weight="bold" fill="#166534">ZOOM-IN: MICROARQUITECTURA INTERNA DE CADA SERVICIO (Patrón Hexagonal / 3 Capas Desacopladas)</text>

    <!-- Column 1: API / Handler -->
    <g transform="translate(80, 735)">
      <rect x="0" y="0" width="370" height="150" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" />
      <rect x="0" y="0" width="370" height="26" rx="6" fill="#E8F5E9" />
      <text x="185" y="18" font-size="12" font-weight="bold" fill="#14532D" text-anchor="middle">1. Capa API / Handler (Adaptador Primario)</text>
      <text x="20" y="45" font-size="10" font-weight="bold" fill="#1F2937">• Recepción:</text>
      <text x="85" y="45" font-size="10" fill="#4B5563">Rutas HTTP REST, resolvers GraphQL o consumidores AMQP.</text>
      <text x="20" y="65" font-size="10" font-weight="bold" fill="#1F2937">• Validación:</text>
      <text x="85" y="65" font-size="10" fill="#4B5563">Deserializa DTOs de entrada (Pydantic / Go structs).</text>
      <text x="20" y="85" font-size="10" font-weight="bold" fill="#1F2937">• Seguridad:</text>
      <text x="85" y="85" font-size="10" fill="#4B5563">Extrae y valida cabecera X-User-ID del Gateway.</text>
      <text x="20" y="105" font-size="10" font-weight="bold" fill="#1F2937">• Respuesta:</text>
      <text x="85" y="105" font-size="10" fill="#4B5563">Mapea entidades a respuestas JSON y códigos de estado (200, 201, 400).</text>
      <text x="20" y="125" font-size="9" fill="#15803D" font-style="italic">Ejemplos: auth/app/handler, messages/internal/handler</text>
    </g>

    <!-- Connector Handler -> Service -->
    <line x1="460" y1="810" x2="520" y2="810" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="490" y="802" font-size="9" font-weight="bold" fill="#166534" text-anchor="middle">Comandos</text>

    <!-- Column 2: Service / Domain -->
    <g transform="translate(530, 735)">
      <rect x="0" y="0" width="370" height="150" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" />
      <rect x="0" y="0" width="370" height="26" rx="6" fill="#E8F5E9" />
      <text x="185" y="18" font-size="12" font-weight="bold" fill="#14532D" text-anchor="middle">2. Capa Service &amp; Domain (Núcleo de Negocio)</text>
      <text x="20" y="45" font-size="10" font-weight="bold" fill="#1F2937">• Casos de Uso:</text>
      <text x="95" y="45" font-size="10" fill="#4B5563">Orquestación de la lógica pura y reglas de aplicación.</text>
      <text x="20" y="65" font-size="10" font-weight="bold" fill="#1F2937">• Reglas Puras:</text>
      <text x="95" y="65" font-size="10" fill="#4B5563">Clamping 0–1000 en reputación, límites de proximidad, auto-votos.</text>
      <text x="20" y="85" font-size="10" font-weight="bold" fill="#1F2937">• Dominio Puro:</text>
      <text x="95" y="85" font-size="10" fill="#4B5563">Entidades de negocio desacopladas de SQL, HTTP y frameworks.</text>
      <text x="20" y="105" font-size="10" font-weight="bold" fill="#1F2937">• Eventos:</text>
      <text x="95" y="105" font-size="10" fill="#4B5563">Dispara eventos asíncronos (message.submitted, rating.changed).</text>
      <text x="20" y="125" font-size="9" fill="#15803D" font-style="italic">Ejemplos: auth_service.py, message_service.go, reputation_service.go</text>
    </g>

    <!-- Connector Service -> Repository -->
    <line x1="910" y1="810" x2="970" y2="810" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="940" y="802" font-size="9" font-weight="bold" fill="#166534" text-anchor="middle">Contratos</text>

    <!-- Column 3: Repository / Adapters -->
    <g transform="translate(980, 735)">
      <rect x="0" y="0" width="380" height="150" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" />
      <rect x="0" y="0" width="380" height="26" rx="6" fill="#E8F5E9" />
      <text x="190" y="18" font-size="12" font-weight="bold" fill="#14532D" text-anchor="middle">3. Capa Repository &amp; Adapters (Adaptador Secundario)</text>
      <text x="20" y="45" font-size="10" font-weight="bold" fill="#1F2937">• Abstracción:</text>
      <text x="90" y="45" font-size="10" fill="#4B5563">Implementa interfaces de almacenamiento específicas.</text>
      <text x="20" y="65" font-size="10" font-weight="bold" fill="#1F2937">• Drivers SQL:</text>
      <text x="90" y="65" font-size="10" fill="#4B5563">Consultas pgx con PostGIS (ST_DWithin), SQLAlchemy async.</text>
      <text x="20" y="85" font-size="10" font-weight="bold" fill="#1F2937">• Drivers NoSQL:</text>
      <text x="90" y="85" font-size="10" fill="#4B5563">Operaciones PyMongo con índices únicos bilaterales.</text>
      <text x="20" y="105" font-size="10" font-weight="bold" fill="#1F2937">• Mensajería:</text>
      <text x="90" y="105" font-size="10" fill="#4B5563">Publishers AMQP al exchange geopicto.events de RabbitMQ.</text>
      <text x="20" y="125" font-size="9" fill="#15803D" font-style="italic">Ejemplos: auth_repository.py, message_repository.go, friendship_repo.py</text>
    </g>
  </g>

  <!-- FOOTER -->
  <text x="720" y="955" font-size="11" fill="#64748B" font-style="italic" text-anchor="middle">
    Principio Arquitectónico: Los microservicios son cortes verticales autónomos. Las 4 capas macro gobiernan el sistema distribuido, y la microarquitectura interna (Handler → Service → Repository) aísla el dominio dentro de cada servicio.
  </text>
</svg>