# Corre las pruebas de cada componente en cada pull request y en cada push a
# main. Cada job es independiente: si falla uno, los demás igual reportan.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si se suben nuevos commits a un PR, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway/pom.xml
      - run: mvn -B test

  messages:
    name: Messages (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/messages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/messages/go.mod
          cache-dependency-path: services/messages/go.sum
      - run: go vet ./...
      - run: go test ./...

  auth:
    name: Auth (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/auth/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  network:
    name: Network (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/network
    steps:
      - uses: actions/checkout@v7
      # setup-uv no publica tags de versión mayor (v10), por eso va la versión exacta.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/network/uv.lock
      - run: uv sync --locked
      # El servicio aún no tiene pruebas: al menos verifica que instala y que la
      # aplicación se construye sin errores de importación.
      - run: uv run --locked python -c "from app.main import create_app; create_app()"

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Solo valida la sintaxis y la configuración; el secreto es de prueba.
      - run: docker compose config --quiet
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-0123456789
